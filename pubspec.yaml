name: offlink
description: Offline-first peer-to-peer messaging over Bluetooth Low Energy.
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_blue_plus: ^2.3.12
  flutter_ble_peripheral: ^3.1.0
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  sqlite3_flutter_libs: any
  path_provider: any
  path: any
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  drift_dev: ^2.35.0
  build_runner: any

flutter:
  uses-material-design: true
