name: Offlink Release Automation

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract PR metadata (if merge commit)
        id: pr_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(git log -1 --pretty=%s | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          PR_TITLE=""
          PR_LABELS=""

          if [ -n "$PR_NUMBER" ]; then
            echo "Detected PR #$PR_NUMBER from merge commit message"
            PR_JSON=$(gh pr view "$PR_NUMBER" --json title,labels 2>/dev/null || true)
            if [ -n "$PR_JSON" ]; then
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
              PR_LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(",")' 2>/dev/null || true)
            fi
          fi

          if [ -z "$PR_TITLE" ]; then
            echo "Searching merged PRs for commit ${{ github.sha }}..."
            PR_JSON=$(gh pr list --state merged --search "${{ github.sha }}" --json number,title,labels --jq '.[0]' 2>/dev/null || true)
            if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
              PR_LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(",")' 2>/dev/null || true)
            fi
          fi

          if [ -z "$PR_TITLE" ]; then
            PR_TITLE=$(git log -1 --pretty=%s)
          fi

          echo "Detected PR Title : $PR_TITLE"
          echo "Detected PR Labels: $PR_LABELS"
          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "labels=$PR_LABELS" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: versioning
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          dart run tool/release/version_calculator.dart \
            --pr-title="${{ steps.pr_meta.outputs.title }}" \
            --labels="${{ steps.pr_meta.outputs.labels }}" \
            --commit-message="${{ github.event.head_commit.message }}" \
            --github-output=$GITHUB_OUTPUT

      - name: Check release conditions
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.versioning.outputs.should_release }}" = "false" ]; then
            echo "Release was skipped by PR title classification or explicit release-skip directive."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG="${{ steps.versioning.outputs.tag }}"
          SOURCE_COMPLETE=false
          DIST_COMPLETE=false

          if gh release view "$TAG" --repo "Omkar-git-hub/offlink" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "Omkar-git-hub/offlink" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "Offlink-"; then
              echo "Release $TAG and assets already exist on source repository."
              SOURCE_COMPLETE=true
            fi
          fi

          if gh release view "$TAG" --repo "Omkar-git-hub/offlink-releases" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "Omkar-git-hub/offlink-releases" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "Offlink-"; then
              echo "Release $TAG and assets already exist on distribution repository."
              DIST_COMPLETE=true
            fi
          fi

          if [ "$SOURCE_COMPLETE" = "true" ] && [ "$DIST_COMPLETE" = "true" ]; then
            echo "Release $TAG is already fully published on both repositories. Skipping redundant release."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Release conditions verified. Proceeding with release / idempotent reconciliation for $TAG."
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        if: steps.release_check.outputs.proceed == 'true'
        run: |
          dart run tool/release/release_notes_generator.dart \
            --version=${{ steps.versioning.outputs.version }} \
            --tag=${{ steps.versioning.outputs.tag }} \
            --pr-title="${{ steps.pr_meta.outputs.title }}" \
            --output=RELEASE_NOTES.md

          # Ensure RELEASE_NOTES.md is never missing or empty
          if [ ! -f RELEASE_NOTES.md ] || [ ! -s RELEASE_NOTES.md ]; then
            echo "Warning: RELEASE_NOTES.md was empty or missing. Generating fallback release notes."
            cat << 'EOF' > RELEASE_NOTES.md
          # Offlink ${{ steps.versioning.outputs.tag }}

          **Release Classification**: Developer Alpha (Pre-Release)
          **Source Repository**: https://github.com/Omkar-git-hub/offlink

          ### 📦 Changes
          - ${{ steps.pr_meta.outputs.title }} (${{ github.sha }})
          EOF
          fi


      - name: Set up Android Keystore
        id: keystore
        if: steps.release_check.outputs.proceed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.OFFLINK_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.OFFLINK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OFFLINK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.OFFLINK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring production release keystore..."
            KEYSTORE_FILE="${{ runner.temp }}/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "OFFLINK_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "OFFLINK_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "OFFLINK_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "OFFLINK_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "signed_type=Android Production Keystore" >> $GITHUB_OUTPUT
          else
            echo "::warning ::OFFLINK_KEYSTORE_BASE64 secret not set. Using debug fallback signing for pre-release."
            mkdir -p ~/.android ~/.config/.android
            if [ ! -f ~/.android/debug.keystore ] && [ ! -f ~/.config/.android/debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore ~/.android/debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
              cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore 2>/dev/null || true
            fi
            echo "signed_type=Android Debug (Fallback Keystore)" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release APK
        if: steps.release_check.outputs.proceed == 'true'
        run: |
          flutter build apk --release \
            --build-name=${{ steps.versioning.outputs.version }} \
            --build-number=${{ steps.versioning.outputs.version_code }} \
            --android-skip-build-dependency-validation

      - name: Prepare and verify release artifact
        id: verify_apk
        if: steps.release_check.outputs.proceed == 'true'
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          APK_NAME="Offlink-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

          dart run tool/release/verify_release_apk.dart \
            --apk="$APK_NAME" \
            --expected-package=io.github.omkar_git_hub.offlink \
            --checksum-file=SHA256SUMS.txt \
            --github-output=$GITHUB_OUTPUT

      - name: Clean up Keystore file
        if: always()
        run: |
          if [ -n "$OFFLINK_KEYSTORE_PATH" ] && [ -f "$OFFLINK_KEYSTORE_PATH" ]; then
            rm -f "$OFFLINK_KEYSTORE_PATH"
            echo "Keystore temporary file securely removed."
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: steps.release_check.outputs.proceed == 'true'
        with:
          name: release-artifacts-${{ steps.versioning.outputs.tag }}
          path: |
            Offlink-${{ steps.versioning.outputs.version }}.apk
            SHA256SUMS.txt
            RELEASE_NOTES.md

      - name: Create or update GitHub Release on source repository (offlink)
        if: steps.release_check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.versioning.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          TAG="${{ steps.versioning.outputs.tag }}"
          VERSION="${{ steps.versioning.outputs.version }}"
          APK_FILE="Offlink-${VERSION}.apk"

          if gh release view "$TAG" --repo "Omkar-git-hub/offlink" >/dev/null 2>&1; then
            echo "Release $TAG already exists on source repository. Uploading/reconciling assets..."
            gh release upload "$TAG" "$APK_FILE" SHA256SUMS.txt --repo "Omkar-git-hub/offlink" --clobber
          else
            echo "Creating new GitHub Release $TAG on source repository..."
            gh release create "$TAG" \
              --repo "Omkar-git-hub/offlink" \
              --target "${{ github.sha }}" \
              --title "Offlink $TAG" \
              --notes-file RELEASE_NOTES.md \
              $PRERELEASE_FLAG \
              "$APK_FILE" \
              SHA256SUMS.txt
          fi


      - name: Publish to distribution repository (offlink-releases)
        if: steps.release_check.outputs.proceed == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning ::RELEASE_TOKEN secret is not set. Skipping release publishing to Omkar-git-hub/offlink-releases."
            echo "To enable automatic publishing to the distribution repo, configure RELEASE_TOKEN secret with 'repo' scope."
            exit 0
          fi

          echo "Cloning distribution repository..."
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/Omkar-git-hub/offlink-releases.git" dist-repo

          echo "Synchronizing distribution repository metadata..."
          dart run tool/release/sync_distribution_repo.dart \
            --distribution-dir=dist-repo \
            --version=${{ steps.versioning.outputs.version }} \
            --version-code=${{ steps.versioning.outputs.version_code }} \
            --tag=${{ steps.versioning.outputs.tag }} \
            --apk="Offlink-${{ steps.versioning.outputs.version }}.apk" \
            --checksum-file=SHA256SUMS.txt \
            --notes=RELEASE_NOTES.md \
            --channel=${{ steps.versioning.outputs.channel }} \
            --prerelease=${{ steps.versioning.outputs.is_prerelease }} \
            --signing-type="${{ steps.keystore.outputs.signed_type }}"

          cd dist-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/ CHANGELOG.md RELEASES.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(release): update metadata and changelog for ${{ steps.versioning.outputs.tag }}"
            git push origin main
          fi
          cd ..

          echo "Publishing GitHub Release to Omkar-git-hub/offlink-releases..."
          dart run tool/release/publish_release.dart \
            --distribution-repo=Omkar-git-hub/offlink-releases \
            --version=${{ steps.versioning.outputs.version }} \
            --tag=${{ steps.versioning.outputs.tag }} \
            --notes=RELEASE_NOTES.md \
            --apk="Offlink-${{ steps.versioning.outputs.version }}.apk" \
            --checksum=SHA256SUMS.txt \
            --prerelease=${{ steps.versioning.outputs.is_prerelease }} \
            --target="main" \
            --token="$RELEASE_TOKEN"

