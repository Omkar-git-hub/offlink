name: Offlink CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Validate PR title convention
        run: |
          dart run tool/release/pr_classifier.dart --validate-title="${{ github.event.pull_request.title }}"

      - name: Check dependency vulnerabilities

        run: |
          dart pub outdated

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure ephemeral PR test signing keystore
        run: |
          CI_KEYSTORE="${{ runner.temp }}/ci-test.jks"
          keytool -genkeypair -v \
            -keystore "$CI_KEYSTORE" \
            -alias citestkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10 \
            -storepass citestpass \
            -keypass citestpass \
            -dname "CN=Offlink CI Test,O=Offlink,C=US"
          echo "OFFLINK_KEYSTORE_PATH=$CI_KEYSTORE" >> $GITHUB_ENV
          echo "OFFLINK_KEYSTORE_PASSWORD=citestpass" >> $GITHUB_ENV
          echo "OFFLINK_KEY_ALIAS=citestkey" >> $GITHUB_ENV
          echo "OFFLINK_KEY_PASSWORD=citestpass" >> $GITHUB_ENV

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify Release APK integrity
        run: |
          dart run tool/release/verify_release_apk.dart \
            --apk=build/app/outputs/flutter-apk/app-release.apk \
            --expected-package=io.github.omkar_git_hub.offlink

      - name: Clean up CI test keystore
        if: always()
        run: |
          if [ -n "$OFFLINK_KEYSTORE_PATH" ] && [ -f "$OFFLINK_KEYSTORE_PATH" ]; then
            rm -f "$OFFLINK_KEYSTORE_PATH"
          fi
