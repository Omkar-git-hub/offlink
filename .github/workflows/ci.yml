name: Offlink CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check dependency vulnerabilities
        run: |
          dart pub outdated

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android ~/.config/.android
          if [ ! -f ~/.android/debug.keystore ] && [ ! -f ~/.config/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore 2>/dev/null || true
          fi

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify Release APK integrity
        run: |
          dart run tool/release/verify_release_apk.dart \
            --apk=build/app/outputs/flutter-apk/app-release.apk \
            --expected-package=io.github.omkar_git_hub.offlink
